# Ohne diese Overrides startet llama-server jedes Modell mit --ctx-size 0
# (= nativer Kontext, bei Devstral 393216) und laedt bis zu 4 Modelle
# gleichzeitig. Auf 27 GiB RAM ist beides ein OOM-Ausloeser.
[Service]
ExecStart=
ExecStart=/usr/bin/llama-server --models-preset %E/llama/server/models.ini --models-max 1

# Schutzgurt. MemoryMax=20G war zu locker: GLM-4.7-Flash brachte GTT+VRAM auf
# 18831 MiB und riss Hyprland mit, ohne je das cgroup-Limit zu beruehren.
# GTT-Seiten zaehlen zum Speicher-cgroup des Prozesses, darum wirkt ein
# knapperes Limit als echte GPU-Bremse: gemessen stabil sind ~13 GB, ab
# ~17,4 GB scheitert das Laden, ab ~18,8 GB stirbt der Compositor.
MemoryMax=16G
MemorySwapMax=0
OOMPolicy=stop
